services:
  - type: web
    name: geodrill-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEODRILL_CORS_ORIGINS
        sync: false
      - key: GEODRILL_CORS_ORIGIN_REGEX
        value: ^https://[a-zA-Z0-9-]+\.vercel\.app$
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
